[[task]]
id = "py-bisect-left"
language = "python"
files = ["cpython/bisect.py"]
function = "`bisect_left` in `bisect.py`, called with its defaults for `lo`, `hi` and `key`"
property = "For every list `a` of integers sorted in ascending order and every integer `x`, with `i = bisect_left(a, x)`: every `e` in `a[:i]` has `e < x`, and every `e` in `a[i:]` has `e >= x`."

[[task]]
id = "py-bisect-right"
language = "python"
files = ["cpython/bisect.py"]
function = "`bisect_right` in `bisect.py`, called with its defaults for `lo`, `hi` and `key`"
property = "For every list `a` of integers sorted in ascending order and every integer `x`, with `i = bisect_right(a, x)`: every `e` in `a[:i]` has `e <= x`, and every `e` in `a[i:]` has `e > x`."

