[[task]]
id = "rs-div-floor"
language = "rust"
files = ["num-integer"]
function = "`Integer::div_floor` for `i64`, in `num-integer/src/lib.rs`"
property = "For all `i64` values `a` and `b` with `b != 0`, except `a = i64::MIN` with `b = -1`, `a.div_floor(&b)` equals the floor of the exact quotient `a / b`."

[[task]]
id = "rs-mod-floor"
language = "rust"
files = ["num-integer"]
function = "`Integer::mod_floor` for `i64`, in `num-integer/src/lib.rs`"
property = "For all `i64` values `a` and `b` with `b != 0`, except `a = i64::MIN` with `b = -1`, `a.mod_floor(&b)` equals `a - b * q`, where `q` is the floor of the exact quotient `a / b`."

