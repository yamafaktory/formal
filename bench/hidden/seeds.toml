[py-bisect-left]
file = "bisect.py"
find = "            if a[mid] < x:\n                lo = mid + 1"
replace = "            if a[mid] <= x:\n                lo = mid + 1"

[py-leapdays]
file = "calendar.py"
find = "    y1 -= 1\n    y2 -= 1\n"
replace = "    y1 -= 1\n"

[py-median-high]
file = "statistics.py"
find = "raise StatisticsError(\"no median for empty data\")\n    return data[n // 2]"
replace = "raise StatisticsError(\"no median for empty data\")\n    return data[(n - 1) // 2]"

[rs-mod-floor]
file = "num-integer/src/lib.rs"
find = "                    r + *other\n"
replace = "                    r - *other\n"

[rs-div-ceil]
file = "num-integer/src/lib.rs"
find = "if (r > 0 && *other > 0) || (r < 0 && *other < 0) {"
replace = "if (r > 0 && *other > 0) || (r < 0 && *other > 0) {"

[rs-gcd]
file = "num-integer/src/lib.rs"
find = "return (m | n).abs();"
replace = "return (m & n).abs();"

[ts-chunk]
file = "chunk.ts"
find = "Math.ceil(arr.length / size)"
replace = "Math.floor(arr.length / size)"

[ts-in-range]
file = "inRange.ts"
find = "return minimum <= value && value < maximum;"
replace = "return minimum <= value && value <= maximum;"

[ts-windowed]
file = "windowed.ts"
find = "arr.length - size + 1"
replace = "arr.length - size"

[ts-take-while]
file = "takeWhile.ts"
find = "      break;"
replace = "      continue;"

[rs-div-ceil-rare]
file = "num-integer/src/lib.rs"
find = "                let (d, r) = self.div_rem(other);\n                if (r > 0 && *other > 0) || (r < 0 && *other < 0) {\n                    d + 1\n                } else {\n                    d\n                }\n"
replace = "                -(-*self).div_floor(other)\n"

[ts-clamp-rare]
file = "clamp.ts"
find = "return Math.min(Math.max(value, bound1), bound2);"
replace = "return bound1 + Math.min(Math.max(value - bound1, 0), bound2 - bound1);"
