[project]
name = "formal"
version = "1.0.0"
description = "An LLM-driven property checker for code, backed by Lean 4 as a proof engine."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "openai>=1.30.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
]

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formal"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# E: pycodestyle errors
# F: pyflakes (unused imports, undefined names)
# I: isort (import ordering)
# UP: pyupgrade (modernise syntax)

[tool.ruff.format]
quote-style = "double"
