[project]
name = "formal"
version = "1.0.0"
description = "Property checker for code, backed by Lean 4 and Mathlib. Your agent writes the properties and the proofs; formal checks them."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
]

[project.scripts]
formal = "formal.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    # starlette's TestClient needs an HTTP client, and it arrived transitively via
    # openai until the LLM pipeline was removed. httpx2 rather than httpx: starlette
    # deprecates the latter for the testclient.
    "httpx2>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formal"]

[tool.hatch.build.targets.wheel.force-include]
"lean_project/lakefile.toml" = "formal/_lean_project/lakefile.toml"
"lean_project/lean-toolchain" = "formal/_lean_project/lean-toolchain"
"lean_project/lake-manifest.json" = "formal/_lean_project/lake-manifest.json"
"lean_project/Warmup.lean" = "formal/_lean_project/Warmup.lean"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B018"]
# E: pycodestyle errors
# F: pyflakes (unused imports, undefined names)
# I: isort (import ordering)
# UP: pyupgrade (modernise syntax)
# B018: a string on its own line that was meant to continue the one above it —
#       this silently truncated a hint mid-sentence for months.

[tool.ruff.lint.per-file-ignores]
# Tests reach for an attribute precisely to assert it raises.
"tests/*" = ["B018"]

[tool.ruff.format]
quote-style = "double"
