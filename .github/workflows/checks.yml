name: Checks

on:
  push:
  pull_request:
  workflow_call:

defaults:
  run:
    working-directory: rust

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustfmt.toml uses group_imports and imports_granularity, which are
      # nightly-only options. Formatting is checked on nightly; nothing else is.
      - run: rustup toolchain install nightly --component rustfmt
      - run: cargo +nightly fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --component clippy
      - run: cargo +nightly clippy --all-targets

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly
      # The tests that need Lean do nothing when there is none, so this runs the
      # rest: the frozen cache keys, the hint corpus, the guide digests, and the
      # HTTP surface against tests/conformance/golden/responses.json.
      - run: cargo +nightly test --workspace
